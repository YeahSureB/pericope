<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pericope">
  <meta name="application-name" content="Pericope">
  <meta name="theme-color" content="#0D0B08">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Pericope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div id="app">

    <!-- Top Bar -->
    <header id="top-bar">
      <div id="streak-display">
        <span id="streak-fire">🔥</span>
        <span id="streak-count">0</span>
      </div>
      <div id="mode-badge" title="Current mode">PIL</div>
      <div id="score-display">
        <span id="daily-score">0</span>
        <span class="score-unit"> pts</span>
      </div>
      <button id="settings-btn" aria-label="Open settings">⚙️</button>
    </header>

    <!-- Game Area -->
    <main id="game-area">
      <div id="pericope-card">
        <div id="pericope-ornament">✦</div>
        <div id="pericope-title">Loading…</div>
      </div>

      <div id="hint-zone">
        <button id="hint-btn">💡 Hint</button>
        <div id="hint-verse" class="hidden"></div>
      </div>

      <div id="progress-zone">
        <div id="level-dots"></div>
        <div id="level-prompt"></div>
      </div>
    </main>

    <!-- Button Panel -->
    <section id="button-panel"></section>

    <!-- Score Overlay -->
    <div id="score-overlay" class="hidden" role="dialog" aria-modal="true">
      <div id="score-card">
        <div id="score-pericope-title">—</div>
        <div id="score-location">—</div>
        <div id="score-points">+0 pts</div>
        <button id="next-btn" disabled>Continue ›</button>
      </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="hidden" role="dialog" aria-modal="true">
      <div id="settings-card">
        <div class="settings-header">
          <span class="settings-title">Settings</span>
          <button id="settings-close" aria-label="Close settings">✕</button>
        </div>

        <div class="settings-section">
          <div class="settings-label">Appearance</div>
          <button id="theme-toggle" class="settings-action-btn">☀️ Light Mode</button>
        </div>

        <div class="settings-section">
          <div class="settings-label">Game Mode</div>
          <div class="mode-btn-row">
            <button id="btn-pilgrimage" class="mode-btn active">📖 Pilgrimage</button>
            <button id="btn-random" class="mode-btn">🗺️ Wanderer</button>
          </div>
          <div id="mode-desc" class="settings-note"></div>
        </div>

        <div class="settings-section">
          <div class="settings-label">Scores</div>
          <div id="stats-grid"></div>
        </div>

        <div class="settings-section" id="progress-section">
          <div class="settings-label">Pilgrimage Progress</div>
          <div id="progress-bar-wrap">
            <div id="progress-bar-fill"></div>
          </div>
          <div id="progress-text"></div>
        </div>
      </div>
    </div>

  </div><!-- #app -->

  <script src="game.js"></script>
</body>
</html>
